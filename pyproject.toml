[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodyregressor"
version = "0.1.0"
description = "从人体测量预测体脂等指标"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "joblib",
]

[project.scripts]
bodyreg-image-to-fat = "BodyRegressor.cli.image_to_fat:main"

[tool.setuptools.packages.find]
where = ["src"]
