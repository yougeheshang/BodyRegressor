[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodyregressor"
version = "0.1.0"
description = "从人体测量预测体脂等指标"
# 与当前运行环境一致（如 3.9.23）；代码避免使用 3.10+ 的 `X | Y` 类型语法
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]
